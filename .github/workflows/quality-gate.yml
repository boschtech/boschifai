name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-tests:
    name: App tests (PHPUnit + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Built before the PHP suite, not in a separate job: Tests\Feature\ExampleTest renders
      # `/`, whose Blade layout calls @vite and needs public/build/manifest.json — so a broken
      # frontend build fails the gate here too.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Same PHP minor version as docker/app/Dockerfile.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # phpunit.xml forces an in-memory SQLite database and sync queue, so no services are
      # needed — only an app key for the framework to boot.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Line coverage of app/ (phpunit.xml <source>) was 92.6% when this floor was set —
      # raise it as coverage improves; never lower it to get a PR through.
      - name: Run tests with coverage
        run: php artisan test --coverage --min=85 --log-junit build/junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-junit
          path: build/junit.xml
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests (Vitest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Coverage floors live in vitest.config.js (thresholds) so `npm run test:coverage` fails
      # the same way locally as it does here.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/js
          if-no-files-found: ignore

  php-style:
    name: PHP code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fix locally with `./vendor/bin/pint`.
      - name: Check code style
        run: ./vendor/bin/pint --test

  cli-tests:
    name: CLI checks (boschifai-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docker/boschifai-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: docker/boschifai-cli

      # Fix locally with `cargo fmt --all`.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Builds every crate as part of testing, so this also catches the CLI no longer
      # compiling — the same binary docker/app/Dockerfile builds for the app image. Line
      # coverage was 99.0% when this floor was set — raise it as coverage improves; never lower
      # it to get a PR through. Locally: `cargo llvm-cov --workspace --fail-under-lines 95`.
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --fail-under-lines 95

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [ app-tests, frontend-tests, php-style, cli-tests ]
    if: always()
    steps:
      - name: Require all jobs to pass
        run: |
          echo "app-tests: ${{ needs.app-tests.result }}"
          echo "frontend-tests: ${{ needs.frontend-tests.result }}"
          echo "php-style: ${{ needs.php-style.result }}"
          echo "cli-tests: ${{ needs.cli-tests.result }}"
          if [ "${{ needs.app-tests.result }}" != "success" ] \
            || [ "${{ needs.frontend-tests.result }}" != "success" ] \
            || [ "${{ needs.php-style.result }}" != "success" ] \
            || [ "${{ needs.cli-tests.result }}" != "success" ]; then
            echo "::error::Quality gate failed — one or more required jobs did not pass."
            exit 1
          fi
