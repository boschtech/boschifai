services:
  app:
    container_name: boschifai-app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: boschifai-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      # "Connect Repo"'s local-filesystem section browses repos from here — read-only since
      # LocalRepoController only ever needs to read from it, never write. See config/boschifai.php's
      # `local_repos.root_path` docblock.
      - ${BOSCHIFAI_LOCAL_REPOS_ROOT:-/Users/garthbosch/projects}:/host-repos:ro
      # Read-only: RunController::activity() (served by THIS container) tails
      # LocalTestRunner::logPathFor() live while a step is running — that path now lives on the
      # `test-runner` sidecar's shared log volume, not local storage. See that service's comment
      # for why local_execution moved out of `worker`.
      - boschifai_test_jobs:/var/boschifai-jobs:ro
    ports:
      - "8420:8000"
    networks:
      - boschifai_net
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: boschifai
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      # Overrides whatever bare-host path .env has for this — same reasoning as the DB_* vars
      # above: this container only ever sees the local-repos root at the bind mount above.
      BOSCHIFAI_LOCAL_REPOS_ROOT_PATH: /host-repos
    # Runs migrations on every start so a fresh `docker compose up` just works — confirmed
    # necessary by a real crash caught in testing: the worker (below) failed outright on first
    # boot because it started before migrations existed, and without `restart:` it just stayed
    # dead rather than retrying.
    #
    # No --isolated flag: confirmed as actively harmful by testing, not just unnecessary.
    # --isolated acquires a cache-based lock, but on a truly fresh database the cache_locks
    # table doesn't exist yet either (it's created BY this same migrate run) — a chicken-and-egg
    # failure on every first boot. Plain `migrate --force` is idempotent (Laravel's own
    # migrations table tracks what's applied); worst case, this and worker's migrate race on
    # the very first boot and one loses with a "table already exists" error — `restart:
    # unless-stopped` retries it, and the second attempt finds migrations already done.
    # `php -S ... public/index.php` directly, NOT `php artisan serve`: confirmed as a real,
    # serious bug via a live user report — `artisan serve` re-spawns the actual dev server as a
    # child process (via Symfony Process) that does NOT correctly inherit this container's
    # DB_CONNECTION=mysql override, silently falling back to `.env`'s committed `sqlite` default
    # instead. Every other process in this container (tinker, the worker's queue:work) resolved
    # `mysql` correctly — only artisan serve's child process didn't. The practical effect: a
    # requirement submitted through the web UI got written to a completely different database
    # (the bind-mounted local database.sqlite) than the one `worker` polls for jobs, so the
    # dispatched job could never be picked up — silent, total pipeline stall, invisible from the
    # UI. Invoking PHP's built-in server directly (Laravel's own documented alternative to
    # `artisan serve`) runs as this container's actual main process, so it inherits the
    # environment normally, same as everything else.
    #
    # docker/app/router.php, NOT public/index.php directly: confirmed as a second real bug
    # caught immediately after the first fix — `artisan serve` doesn't just run the built-in
    # server, it uses its OWN router script that passes real static files straight through
    # before falling back to index.php. Pointing PHP's built-in server at index.php directly
    # removed that passthrough, so requests for the JS/CSS bundles hit routes/web.php's SPA
    # catch-all instead of the actual files, got back HTML, and the browser refused to execute
    # it as a module script — a blank page with no visible error. router.php reproduces that
    # passthrough logic without going through artisan serve's Process wrapper.
    command: sh -c "php artisan migrate --force && php -S 0.0.0.0:8000 -t public docker/app/router.php"
    depends_on:
      db:
        condition: service_healthy

  # Runs the actual pipeline jobs — Claude invocations, orchestration, git/push. Local test
  # EXECUTION itself (composer install + phpunit) happens in the `test-runner` service below,
  # not here — see that service's own comment for why. `app` (web/API) never runs jobs.
  # A GitHub-connected target repo is cloned fresh over HTTPS using the connected account's
  # OAuth token into its own persistent checkout (see RepoCheckoutManager/GithubOAuthService);
  # a locally-connected one is used directly from the bind mount below instead.
  worker:
    container_name: boschifai-worker
    image: boschifai-app # same image as `app` — just a different command
    restart: unless-stopped
    # Runs its own migrate (see app's command comment above for why no --isolated) before
    # polling. RepoConfig rows come from "Connect Repo" (GitHub OAuth or a local checkout) —
    # nothing left to seed here.
    command: sh -c "php artisan migrate --force && php artisan queue:work --tries=1"
    volumes:
      - .:/var/www/html
      # Read-write, unlike `app`'s mount of the same host path: RunWorkspaceManager writes
      # `.claude/` scaffolding, generated test files, and JUnit reports directly into a
      # locally-connected repo's own directory (no clone — see RepoCheckoutManager's own
      # docblock), and BranchAndCommitService commits from there for the push step. All of that
      # runs in THIS container, never in `app`, which only ever reads this path to list/browse
      # repos when connecting one — confirmed as a real bug via a live run: with this mounted
      # `:ro`, `boschifai init --yes --force` failed outright with "Read-only file system",
      # leaving the Run stuck at `gap_analysis_running` with no failed-step message.
      - ${BOSCHIFAI_LOCAL_REPOS_ROOT:-/Users/garthbosch/projects}:/host-repos:rw
      # Composer's cache, persisted across runs/containers so `composer install` in
      # LocalTestRunner and this app's own dependency install both hit cache instead of
      # re-downloading every time.
      - boschifai_composer_cache:/root/.composer/cache
      # The job-file protocol LocalTestRunner speaks to `test-runner` (write a {run_id}.job.json
      # here, poll for {run_id}.done.json) — see that service's comment and
      # docker/test-runner/poll.php's docblock for the full protocol and why it exists.
      - boschifai_test_jobs:/var/boschifai-jobs
    networks:
      - boschifai_net
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: boschifai
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional — see config/boschifai.php's github_mcp docblock. Blank keeps PushAndOpenPrJob
      # on its original deterministic push path; only worker needs this, since only worker
      # invokes Claude.
      GITHUB_MCP_PAT: ${GITHUB_MCP_PAT:-}
      # See the identical override in `app` above.
      BOSCHIFAI_LOCAL_REPOS_ROOT_PATH: /host-repos
    depends_on:
      db:
        condition: service_healthy

  # Runs a connected repo's OWN `composer install` + test suite (see LocalTestRunner) — split out
  # from `worker` in direct response to a real incident: `worker` carries Boschifai's own live DB
  # credentials as ambient environment (needed for its own queue/app work), and a connected
  # repo's test suite inherits that environment when its command runs as `worker`'s own child
  # process. RAMS's own phpunit.xml tries to override DB_* to sqlite for its tests but doesn't
  # set `force="true"` on those overrides, so PHPUnit left the inherited (Boschifai's real)
  # values in place; its test suite's `RefreshDatabase` trait then ran `migrate:fresh` against
  # Boschifai's actual database, wiping it. Splitting test execution into a container that never
  # HAS those credentials makes that class of failure structurally impossible, not just
  # mitigated by remembering to scrub env vars correctly everywhere.
  #
  # Deliberately no DB_, QUEUE_CONNECTION, or ANTHROPIC_API_KEY vars, and no `boschifai_net` —
  # this container has no route to `db` at all, so even a connected repo's own code hardcoding
  # `DB_HOST=db` (not just inheriting it) still can't reach it.
  #
  # Deliberately mounts only the two paths a checkout can live under — NOT `.:/var/www/html` —
  # so there's no `.env`/`vendor/` here for the standalone poller script to ever accidentally
  # load (see docker/test-runner/poll.php's own docblock for why that matters even for code we
  # trust).
  test-runner:
    container_name: boschifai-test-runner
    image: boschifai-app # same image as `app`/`worker` — reuses its PHP/Composer/gd/exif toolchain
    restart: unless-stopped
    command: php /opt/boschifai/test-runner-poll.php
    volumes:
      # Same path as `worker`'s own mount, for a locally-connected repo.
      - ${BOSCHIFAI_LOCAL_REPOS_ROOT:-/Users/garthbosch/projects}:/host-repos:rw
      # Same absolute path `worker` resolves via its own full `.:/var/www/html` mount, for a
      # GitHub-connected repo's persistent clone (see RepoCheckoutManager) — mounted at just this
      # one subdirectory, not the whole project.
      - ./var/boschifai/repos:/var/www/html/var/boschifai/repos:rw
      - boschifai_composer_cache:/root/.composer/cache
      - boschifai_test_jobs:/var/boschifai-jobs
    # A dedicated bridge network, deliberately NOT `boschifai_net` — this container still needs
    # normal internet egress (composer installs a connected repo's own dependencies from
    # packagist/GitHub), just no L2/L3 path to `db` or any other Boschifai service. Two
    # containers on different user-defined bridge networks can't reach each other by name OR by
    # IP, which is what actually matters here — the missing DB_* env vars alone wouldn't stop a
    # connected repo's own code from hardcoding `DB_HOST=db` and trying anyway.
    networks:
      - test_runner_net

  db:
    image: mysql:8.0.32
    container_name: boschifai-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: boschifai
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - boschifai_dbdata:/var/lib/mysql
    networks:
      - boschifai_net

networks:
  boschifai_net:
    driver: bridge
  # `test-runner`'s own isolated network — see that service's comment for why it's kept separate
  # from `boschifai_net` rather than just omitting DB_* env vars and calling it done.
  test_runner_net:
    driver: bridge

volumes:
  boschifai_dbdata:
    driver: local
  # Composer's cache — see the `worker` service's own comment on this mount.
  boschifai_composer_cache:
    driver: local
  # The job-file protocol between `worker` and `test-runner` — see docker/test-runner/poll.php.
  boschifai_test_jobs:
    driver: local
