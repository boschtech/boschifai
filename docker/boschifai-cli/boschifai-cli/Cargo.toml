[package]
name = "boschifai-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "boschifai"
path = "src/main.rs"

[dependencies]
boschifai-core = { path = "../boschifai-core" }
boschifai-ai = { path = "../boschifai-ai" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
